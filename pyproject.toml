[project]
name = "hybrid-gnn-quesado"
version = "0.1.0"
description = "GNN framework for toxicity and molecular property prediction"
requires-python = "==3.9.*"
dependencies = [
    "torch==1.9.0",
    "torchvision==0.10.0",
    "torch-scatter==2.0.8",
    "torch-sparse==0.6.11",
    "torch-cluster==1.5.9",
    "torch-spline-conv==1.2.1",
    "torch-geometric==2.1.0",
    "numpy==1.21.5",
    "pandas==1.4.3",
    "scipy==1.7.3",
    "scikit-learn==1.1.1",
    "seaborn==0.12.0",
    "matplotlib==3.5.3",
    "networkx==2.8.6",
    "rdkit==2022.03.5",
    "optuna>=4.9.0",
]

[tool.uv]
# Global fallback links so uv knows where to find legacy wheels
find-links = [
    "https://download.pytorch.org/whl/cu102/torch_stable.html",
    "https://data.pyg.org/whl/torch-1.9.0+cu102.html"
]

# This solves the ModuleNotFoundError: No module named 'torch' compile crash
[tool.uv.extra-build-dependencies]
torch-scatter = ["torch==1.9.0"]
torch-sparse = ["torch==1.9.0"]
torch-cluster = ["torch==1.9.0"]
torch-spline-conv = ["torch==1.9.0"]
